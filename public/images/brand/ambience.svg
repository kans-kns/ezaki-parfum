<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1200" width="1200" height="1200" role="img" aria-label="Ambiance EZAKI Parfum">
  <defs>
    <radialGradient id="glow" cx="50%" cy="38%" r="55%">
      <stop offset="0%" stop-color="#C9A227" stop-opacity="0.55"/>
      <stop offset="55%" stop-color="#C9A227" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#C9A227" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="goldline" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8C6F14"/>
      <stop offset="50%" stop-color="#E5C76B"/>
      <stop offset="100%" stop-color="#C9A227"/>
