<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800" role="img" aria-label="Coffret EZAKI Parfum">
  <defs>

    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8C6F14"/>
      <stop offset="45%" stop-color="#E5C76B"/>
      <stop offset="100%" stop-color="#C9A227"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="55%" r="55%">
      <stop offset="0%" stop-color="#C9A227" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#C9A227" stop-opacity="0"/>
    </radialGradient>
      <radialGradient id="vignette" cx="50%" cy="45%" r="72%">
        <stop offset="55%" stop-color="#000000" stop-opacity="0"/>
        <stop offset="100%" stop-color="#000000" stop-opacity="0.55"/>
      </radialGradient>
      <filter id="grain" x="0" y="0" width="100%" height="100%">
        <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" seed="7" result="noise"/>
        <feColorMatrix type="saturate" values="0" in="noise" result="mono"/>
        <feComponentTransfer in="mono" result="soft">
          <feFuncA type="linear" slope="0.16" intercept="0"/>
        </feComponentTransfer>
        <feBlend in="SourceGraphic" in2="soft" mode="overlay"/>
      </filter>
  </defs>
  <rect width="800" height="800" fill="#0A0A0A"/>
  <circle cx="400" cy="440" r="400" fill="url(#halo)"/>
  <rect x="330" y="238" width="140" height="62" rx="31" fill="none" stroke="url(#g)" stroke-width="2" opacity="0.7"/>
  <rect x="180" y="298" width="440" height="322" rx="16" fill="#151515" stroke="url(#g)" stroke-width="2"/>
  <rect x="180" y="298" width="440" height="66" rx="16" fill="url(#g)" opacity="0.9"/>
  <text x="400" y="344" text-anchor="middle" font-family="Georgia, serif" font-size="30" letter-spacing="9" fill="#0A0A0A">EZAKI</text>
  <text x="400" y="470" text-anchor="middle" font-family="Georgia, serif" font-size="46" letter-spacing="12" fill="url(#g)">EZAKI</text>
  <text x="400" y="522" text-anchor="middle" font-family="Georgia, serif" font-size="26" letter-spacing="14" fill="url(#g)" opacity="0.85">PARFUM</text>
  <text x="400" y="580" text-anchor="middle" font-family="Georgia, serif" font-size="24" fill="#E5C76B" opacity="0.7">عطر فاخر</text>
  <rect width="100%" height="100%" fill="url(#vignette)"/>
  <rect width="100%" height="100%" filter="url(#grain)" opacity="0.5"/>
  <rect x="24" y="24" width="752" height="752" rx="26" fill="none" stroke="#C9A227" stroke-opacity="0.16"/>
</svg>
